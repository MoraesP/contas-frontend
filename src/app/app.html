<div class="min-h-screen flex flex-col md:flex-row">
  @if (auth.autenticado()) {
    <nav class="md:w-56 shrink-0 border-b md:border-b-0 md:border-r border-hair px-4 py-5 md:py-8 flex md:flex-col justify-between">
      <div>
        <div class="font-display text-sm font-extrabold tracking-[0.14em] uppercase text-brass mb-6 px-3">Contas</div>
        <div class="flex md:flex-col gap-1">
          <a
            routerLink="/"
            routerLinkActive="bg-panel-2 text-ink"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-3 py-2 rounded-md text-sm font-semibold text-ink-soft hover:text-ink hover:bg-panel-2 transition"
          >
            Dashboard
          </a>
          <a
            routerLink="/cartoes"
            routerLinkActive="bg-panel-2 text-ink"
            class="px-3 py-2 rounded-md text-sm font-semibold text-ink-soft hover:text-ink hover:bg-panel-2 transition"
          >
            Cartões
          </a>
          <a
            routerLink="/pessoas"
            routerLinkActive="bg-panel-2 text-ink"
            class="px-3 py-2 rounded-md text-sm font-semibold text-ink-soft hover:text-ink hover:bg-panel-2 transition"
          >
            Pessoas
          </a>
          <a
            routerLink="/historico"
            routerLinkActive="bg-panel-2 text-ink"
            class="px-3 py-2 rounded-md text-sm font-semibold text-ink-soft hover:text-ink hover:bg-panel-2 transition"
          >
            Histórico
          </a>
        </div>
      </div>
      <button
        type="button"
        (click)="sair()"
        class="px-3 py-2 text-left rounded-md text-sm font-semibold text-ink-soft hover:text-ink hover:bg-panel-2 transition"
      >
        Sair
      </button>
    </nav>
  }
  <main class="flex-1 min-w-0">
    <router-outlet />
  </main>
</div>
<app-dialog-host />
