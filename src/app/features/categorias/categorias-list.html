<div class="max-w-4xl mx-auto p-6 md:p-10">
  <div class="flex justify-between items-center mb-6">
    <h1 class="font-display text-xl font-extrabold tracking-tight">Categorias</h1>
    <button
      type="button"
      (click)="novo()"
      class="text-sm font-semibold bg-brass text-bg px-4 py-2 rounded-md hover:opacity-90 transition"
    >
      + Nova categoria
    </button>
  </div>

  @if (mostrarForm()) {
    <form
      (ngSubmit)="salvar()"
      class="rounded-[10px] border border-hair p-5 mb-6"
      [style.background]="'linear-gradient(155deg, var(--color-panel-2), var(--color-panel))'"
    >
      <h2 class="text-sm font-bold mb-4">Nova categoria</h2>
      <div class="grid grid-cols-1 gap-4 mb-4">
        <label class="text-xs text-ink-soft font-semibold">
          Nome
          <input
            name="nome"
            [(ngModel)]="nome"
            required
            class="mt-1 w-full bg-bg border border-hair rounded-md px-3 py-2 text-sm text-ink"
          />
        </label>
      </div>
      <div class="flex gap-2 justify-end">
        <button
          type="button"
          (click)="cancelar()"
          class="text-sm font-semibold text-ink-soft px-4 py-2 rounded-md hover:text-ink transition"
        >
          Cancelar
        </button>
        <button type="submit" class="text-sm font-semibold bg-teal text-bg px-4 py-2 rounded-md hover:opacity-90 transition">
          Salvar
        </button>
      </div>
    </form>
  }

  @if (carregando()) {
    <div class="flex flex-col gap-1">
      @for (i of [0, 1, 2, 3]; track i) {
        <div class="flex justify-between items-center py-3 border-b border-hair">
          <app-skeleton width="120px" />
          <app-skeleton width="48px" height="0.75rem" />
        </div>
      }
    </div>
  } @else {
  <div class="flex flex-col gap-1">
    @for (c of store.categorias(); track c.id) {
      <div class="flex justify-between items-center py-3 border-b border-hair text-sm">
        <span class="font-semibold">{{ c.nome }}</span>
        <button type="button" (click)="excluir(c)" class="text-xs font-semibold text-ink-soft hover:text-ink transition">
          Excluir
        </button>
      </div>
    } @empty {
      <p class="text-ink-soft text-sm">Nenhuma categoria cadastrada ainda.</p>
    }
  </div>
  }
</div>
